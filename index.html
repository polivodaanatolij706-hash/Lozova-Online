<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lozova Online</title>

  <style>
    body {
      margin: 0;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .game {
      padding-top: 80px;
    }

    h1 {
      font-size: 42px;
    }

    button {
      padding: 15px 35px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🚂 LOZOVA ONLINE</h1>
    <p>Ласкаво просимо до Лозової!</p>

    <button onclick="startGame()">Грати</button>

    <p id="message"></p>
  </div>

  <script>
    function startGame() {
      document.getElementById("message").textContent =
        "Гра запускається...";
    }
  </script>

</body>
</html>
